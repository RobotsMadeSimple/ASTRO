name: Release Print and STEP Files

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only pull the LFS files that go into the zips (skips the doc images)
      - name: Pull LFS files
        run: git lfs pull --include="print_files/**,CAD/*.step"

      - name: Check no LFS pointers are left
        run: |
          if grep -rlI "^version https://git-lfs.github.com/spec/v1" print_files/ CAD/*.step; then
            echo "::error::Files above are still LFS pointers"
            exit 1
          fi

      # Zip names stay fixed so the website can link to
      # releases/latest/download/<name>.zip; VERSION.txt inside says which release it is
      - name: Write VERSION.txt
        run: echo "$TAG" > VERSION.txt

      - name: Zip print files
        run: |
          zip -r ASTRO-print-files.zip print_files/
          zip -j ASTRO-print-files.zip VERSION.txt

      - name: Zip STEP files
        run: zip -j ASTRO-step-files.zip CAD/*.step VERSION.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ASTRO ${{ env.TAG }}
          files: |
            ASTRO-print-files.zip
            ASTRO-step-files.zip
          generate_release_notes: true
